name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check app.py compiles
        run: python -m py_compile app.py train_model.py

      - name: Retrain model and verify artifacts
        run: python train_model.py

      - name: Smoke-test model prediction
        run: |
          python -c "
          import joblib, pandas as pd
          model = joblib.load('house_price_model.pkl')
          sample = pd.DataFrame([{
              'OverallQual': 7, 'GrLivArea': 1800, 'GarageCars': 2, 'TotalBsmtSF': 900,
              'FullBath': 2, 'YearBuilt': 2000, 'YearRemodAdd': 2005, 'LotArea': 9000,
              'Fireplaces': 1, 'Neighborhood': 'CollgCr', 'HouseStyle': '2Story',
              'ExterQual': 'Gd', 'KitchenQual': 'Gd'
          }])
          pred = model.predict(sample)
          proba = model.predict_proba(sample)
          assert pred.shape == (1,), 'Prediction shape mismatch'
          assert proba.shape == (1, 2), 'Probability shape mismatch'
          print('Smoke test passed. Prediction:', pred[0], 'Confidence:', proba.max())
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t house-price-predictor:ci .
